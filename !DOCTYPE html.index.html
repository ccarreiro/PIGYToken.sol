<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title> <button> PIGY COIN NFT </button> </title>
  <style>
    body {
      display: flex;
      height: 100vh;
      margin: 0;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #fff;
      font-family: sans-serif;
      flex-direction: column;
    }

    .coin-container {
      width: 200px;
      height: 200px;
      perspective: 1000px;
      margin-bottom: 20px;
    }

    .coin {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #222;
      position: relative;
      transform-style: preserve-3d;
      animation: spin 5s linear infinite;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 50%;
      overflow: hidden;
    }

    .coin-front {
      transform: rotateY(0deg);
    }

    .coin-back {
      transform: rotateY(180deg);
      /* opcional: mostrar verso da moeda */
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .coin-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes spin {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }

    a.button {
      display: inline-block;
      padding: 10px 20px;
      background: #e91e63;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      transition: background .3s;
    }
    a.button:hover {
      background: #d81b60;
    }
  </style>
</head>
<body>

  <div class="coin-container">
    <div class="coin">
      <!-- Frente da moeda: sua imagem NFT -->
      <div class="coin-face coin-front">
        <img src="https://media.mintable.com/mintable_gasless/01J4NJ81MR59FY698G2CN6R62E/01J4NJ81MR59FY698G2CN6R62E" alt="PIGY NFT" />
      </div>
      <!-- Verso da moeda: opcional (pode colocar logo PIGY ou cor sólida) -->
      <div class="coin-face coin-back">
        PIGY
      </div>
    </div>
  </div>

  <a class="button" href="https://app.uniswap.org/#/pool?chain=polygon" target="_blank">
   <button> Ver Pool no Uniswap </button>
  </a>

</body>
</html>
